name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - '.github/**'
      - '!.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Keystore & Signing Properties
        run: |
          touch signing.properties
          echo "storeFile=../keystore.jks" >> signing.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> signing.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS }}" >> signing.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_ALIAS_PASSWORD || secrets.KEYSTORE_PASSWORD }}" >> signing.properties
          
          # Decode keystore supporting either KEYSTORE_BASE64 or KEYSTORE
          echo "${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}" | base64 --decode > keystore.jks

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          echo "filename=$(jq -r '.elements.[0].outputFile' app/build/outputs/apk/release/output-metadata.json)" >> $GITHUB_ENV

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.filename }}
          path: app/build/outputs/apk/release/${{ env.filename }}
          
